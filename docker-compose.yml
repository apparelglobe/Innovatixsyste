# Local development infrastructure for Innovatix.
# Canonical local database. Staging/production use the SAME engine + migrations.
#
#   docker compose up -d        # start Postgres
#   docker compose ps           # health
#   docker compose down         # stop (keeps data volume)
#   docker compose down -v      # stop + wipe data (destructive)
#
# Credentials/port here MUST match apps/api/.env DATABASE_URL.
services:
  postgres:
    image: postgres:16
    container_name: innovatix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: innovatix
      POSTGRES_PASSWORD: innovatix_dev_pw
      POSTGRES_DB: innovatix
      # deterministic, case-aware collation for reliable citext / lower() indexes
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    ports:
      # Bind to loopback only — never expose Postgres on a public interface.
      - '127.0.0.1:5432:5432'
    volumes:
      - innovatix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U innovatix -d innovatix']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  innovatix_pgdata:
    name: innovatix_pgdata
